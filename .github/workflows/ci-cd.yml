name: Zero-Touch Analyzer CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    name: Test and Build Application
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v3
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '1.1'
        
    - name: 📦 Cache Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 📚 Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install safety pytest
        
    - name: 🔍 Code Quality Check (Pylint)
      run: |
        echo "Running Pylint on application..."
        pylint app.py --exit-zero || true
        pylint analyzers/*.py --exit-zero || true
        
    - name: 🛡️ Security Scan
      run: |
        echo "Checking for security vulnerabilities..."
        safety check --json || true
        
    - name: 🧪 Run Analyzer Tests
      run: |
        python3 -c "
import sys
sys.path.insert(0, '.')
from analyzers.python_analyzer import PythonAnalyzer
from analyzers.c_analyzer import CAnalyzer
from analyzers.cpp_analyzer import CppAnalyzer
from analyzers.java_analyzer import JavaAnalyzer
from analyzers.javascript_analyzer import JavaScriptAnalyzer

print('Testing Python Analyzer...')
py_analyzer = PythonAnalyzer()
result = py_analyzer.analyze('print(\"Hello World\")')
assert 'language' in result
print('✓ Python Analyzer working')

print('Testing C Analyzer...')
c_analyzer = CAnalyzer()
result = c_analyzer.analyze('int main() { return 0; }')
assert 'language' in result
print('✓ C Analyzer working')

print('Testing C++ Analyzer...')
cpp_analyzer = CppAnalyzer()
result = cpp_analyzer.analyze('int main() { return 0; }')
assert 'language' in result
print('✓ C++ Analyzer working')

print('Testing Java Analyzer...')
java_analyzer = JavaAnalyzer()
result = java_analyzer.analyze('class Test { }')
assert 'language' in result
print('✓ Java Analyzer working')

print('Testing JavaScript Analyzer...')
js_analyzer = JavaScriptAnalyzer()
result = js_analyzer.analyze('console.log(\"test\");')
assert 'language' in result
print('✓ JavaScript Analyzer working')

print('\\n✅ All analyzers tested successfully!')
"
        
    - name: 📦 Build Package
      run: |
        echo "Creating deployment package..."
        tar -czf zero-touch-analyzer.tar.gz \
          app.py \
          requirements.txt \
          runtime.txt \
          render.yaml \
          templates/ \
          static/ \
          analyzers/ \
          LICENSE
        echo "✓ Package created successfully"
        
    - name: 📤 Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: zero-touch-analyzer-package
        path: zero-touch-analyzer.tar.gz
        retention-days: 30

  deploy-production:
    name: Deploy to Production
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v3
      
    - name: 🚀 Deploy to Render
      run: |
        echo "========================================="
        echo "🚀 DEPLOYING TO PRODUCTION"
        echo "========================================="
        echo "✓ Tests passed"
        echo "✓ Code quality checked"
        echo "✓ Security scan completed"
        echo "✓ Package built successfully"
        echo ""
        echo "Deployment Process:"
        echo "1. Code pushed to main branch"
        echo "2. Render will automatically detect changes"
        echo "3. Render will build and deploy the application"
        echo "4. Application will be live at your Render URL"
        echo ""
        echo "📝 Note: Make sure you have connected your GitHub"
        echo "repository to Render for automatic deployments"
        echo "========================================="
        echo "✅ DEPLOYMENT INITIATED"
        echo "========================================="

  notify:
    name: Notify Build Status
    needs: [test-and-build, deploy-production]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📢 Build Status
      run: |
        if [ "${{ needs.test-and-build.result }}" == "success" ] && [ "${{ needs.deploy-production.result }}" == "success" ]; then
          echo "========================================="
          echo "✅ CI/CD PIPELINE COMPLETED SUCCESSFULLY"
          echo "========================================="
          echo "All checks passed!"
          echo "Application deployed to production"
          echo "========================================="
        else
          echo "========================================="
          echo "❌ CI/CD PIPELINE FAILED"
          echo "========================================="
          echo "Please check the logs for details"
          echo "========================================="
        fi
